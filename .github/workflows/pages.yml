name: GitHub Pages

on:
  push:
    branches:
      - main # default branch
  workflow_dispatch:

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7
        # with:
        # token: ${{ secrets.GITHUB_TOKEN }}
        # If your repository depends on submodule, please see: https://github.com/actions/checkout
        # submodules: recursive

      - name: Use mise
        uses: jdx/mise-action@v5

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-cache-${{ runner.OS }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-cache-${{ runner.OS }}-${{ runner.arch }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cos-file
          path: ./public

      - name: Clean up pnpm store
        run: pnpm store prune

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  sendCOS:
    needs: build

    runs-on: ubuntu-latest

    environment: COS

    steps:
      - name: Download the only Artifact
        uses: actions/download-artifact@v8
        with:
          name: cos-file
          path: ./public

      - name: Upload to COS
        uses: sylingd/tencent-cos-and-cdn-action@v1
        with:
          secret_id: ${{ secrets.TCLOUD_ID }}
          secret_key: ${{ secrets.TCLOUD_KEY }}
          cos_bucket: ${{ secrets.TCLOUD_BUCKET }}
          cos_region: ${{ secrets.TCLOUD_REGION }}
          cos_replace_file: crc64ecma
          cdn_prefix: ${{ vars.TCLOUD_CDN_PREFIX }}
          cdn_type: eo
          eo_zone: ${{ secrets.TCLOUD_EO_ZONE }}
          local_path: public
          remote_path: ""
          clean: true
