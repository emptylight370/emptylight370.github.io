name: GitHub Pages

on:
  push:
    branches:
      - main # default branch
  workflow_dispatch:

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # with:
        # token: ${{ secrets.GITHUB_TOKEN }}
        # If your repository depends on submodule, please see: https://github.com/actions/checkout
        # submodules: recursive

      - name: Use mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-cache-${{ runner.OS }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-cache-${{ runner.OS }}-${{ runner.arch }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cos-file
          path: ./public

      - name: Clean up pnpm store
        run: pnpm store prune

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  sendCOS:
    needs: build

    runs-on: ubuntu-latest

    environment: COS

    steps:
      - name: Download the only Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cos-file
          path: ./public

      - name: Upload to COS
        uses: sylingd/tencent-cos-and-cdn-action@f5d399ae58dd887f06964ad88bf854d219ffc4c8 # v1.5.2
        with:
          secret_id: ${{ secrets.TCLOUD_ID }}
          secret_key: ${{ secrets.TCLOUD_KEY }}
          cos_bucket: ${{ secrets.TCLOUD_BUCKET }}
          cos_region: ${{ secrets.TCLOUD_REGION }}
          cos_replace_file: crc64ecma
          cdn_prefix: ${{ vars.TCLOUD_CDN_PREFIX }}
          cdn_type: eo
          eo_zone: ${{ secrets.TCLOUD_EO_ZONE }}
          local_path: public
          remote_path: ""
          clean: true
