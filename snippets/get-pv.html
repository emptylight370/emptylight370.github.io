<!-- post-log.html : Inside 主题文章/页面 PV 插件（OpenKounter 适配版） -->
<script>
  (function (window, document) {
    "use strict";

    // ===== 配置（硬编码）=====
    var API_SERVER = "https://open-pv.emptylight.cn";
    var SITE_PV_KEY = "site-pv"; // 站点总 PV，仅在后端控制台可见
    var IGNORE_LOCAL = true; // 本地开发环境（localhost 等）不计数

    if (
      IGNORE_LOCAL &&
      ["localhost", "127.0.0.1", "[::1]"].indexOf(window.location.hostname) !==
        -1
    ) {
      return;
    }

    // 当前路由归一化，如 '/post/inside-theme-showcase/' -> 'post/inside-theme-showcase'
    var target =
      decodeURI(window.location.pathname).replace(/\/*(index\.html)?$/, "") ||
      "/";
    var key = target.replace(/^\//, "");
    // 根目录无显示访问量的接口，无需发起读取请求
    var isRoot = target === "/";

    // 1. 批量上报：站点总 PV + 当前页面 PV（含根目录）+ 访问来源域名
    var requests = [{ target: SITE_PV_KEY }, { target: target }];
    requests.push({ target: window.location.hostname });

    fetch(API_SERVER + "/api/counter", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "batch_inc",
        requests: requests,
      }),
    })
      .catch(function (error) {
        // 上报失败不阻塞后续读取
        console.error("OpenKounter increment error:", error);
      })

      // 2. 读取当前路由 PV（根目录无显示接口则跳过；site-pv 与域名计数仅后端可见，不读取）
      .then(function () {
        if (isRoot) return null;
        return fetch(
          API_SERVER + "/api/counter?target=" + encodeURIComponent(target),
        );
      })
      .then(function (resp) {
        if (!resp) return null;
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(function (res) {
        if (!res) return;
        if (res.code !== 0) throw new Error(res.message || "Unknown error");
        // 3. 展示
        document.dispatchEvent(
          new CustomEvent("inside", {
            detail: {
              type: "pv",
              data: { [key]: res.data.time || 0 },
            },
          }),
        );
      })
      .catch(function (error) {
        console.error("OpenKounter PV error:", error);
      });
  })(window, document);
</script>
